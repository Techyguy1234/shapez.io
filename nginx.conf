server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Strip the cache-busting /v/<hash>/ prefix injected by the build
    location ~ ^/v/[^/]+/(.*)$ {
        try_files /$1 =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
